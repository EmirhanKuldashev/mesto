# Standalone disposable test stack. Do not combine with production Compose.
services:
  routing:
    build:
      context: ./backend
      dockerfile: data/routing/Dockerfile
    healthcheck:
      test: ["CMD", "bash", "/opt/mesto-healthcheck.sh"]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mesto_e2e
      POSTGRES_USER: mesto_e2e
      POSTGRES_PASSWORD: disposable_e2e_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesto_e2e -d mesto_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mesto_e2e:disposable_e2e_password@db:5432/mesto_e2e
      FRONTEND_ORIGIN: http://127.0.0.1:3100
      ORCA_API_KEY: ""
      MESTO_CAR_ROUTING_URL: http://routing:5000
    depends_on:
      db:
        condition: service_healthy
      routing:
        condition: service_healthy
    ports:
      - "127.0.0.1:18100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:18100
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
