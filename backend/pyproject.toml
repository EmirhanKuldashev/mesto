[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesto-backend"
version = "0.1.0"
description = "MESTO geospatial analysis API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "geoalchemy2>=0.15,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
scrape = ["playwright>=1.58,<2"]

[tool.setuptools.packages.find]
include = ["app*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostGIS test database"]
